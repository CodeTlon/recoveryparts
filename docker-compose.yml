# Solo desarrollo local: Postgres en el puerto 54322 (npm run db:start). Coolify usa docker-compose.coolify.yml.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-recoveryparts}
    ports:
      - '127.0.0.1:54322:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-recoveryparts}']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
