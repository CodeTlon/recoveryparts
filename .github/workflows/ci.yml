name: CI
on:
  pull_request:
    branches: [dev, test, main]
  push:
    branches: [dev]

# Mínimo privilegio: la CI solo lee el repo (no necesita escribir ni abrir PRs).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Tipos y build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:unit
      # Solo errores bloquean; los avisos (any, etc.) son deuda conocida.
      - run: npm run lint
      # El build no necesita base de datos: sin DATABASE_URL compila y muestra vacíos.
      - run: npm run build

  e2e:
    name: E2E (3 viewports, con base de datos)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: recoveryparts }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # La app (npm start) y los tests de acceso comparten esta base. SESSION_SECRET es solo de CI.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/recoveryparts
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/migrate.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  base-de-datos:
    name: Migraciones desde cero + reglas
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: recoveryparts }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/recoveryparts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Aplicar migraciones desde cero + seed
        run: node scripts/migrate.mjs --seed
      - name: Es idempotente (segunda corrida sin cambios)
        run: node scripts/migrate.mjs
      - name: Todas las tablas con RLS
        run: |
          out=$(psql "$DATABASE_URL" -At -c "select string_agg(tablename, ',') from pg_tables where schemaname='public' and not rowsecurity")
          test -z "$out" || { echo "Tablas sin RLS: $out"; exit 1; }
      - name: El alta sin invitación no genera perfil
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          begin;
          insert into auth.users (email, raw_user_meta_data) values ('x@x.com', '{"rol":"admin"}');
          do $$ begin
            if exists (select 1 from profiles where email = 'x@x.com') then raise exception 'un alta sin invitación generó perfil'; end if;
          end $$;
          rollback;
          SQL
      - name: Reglas de negocio de la base (estados, cupo, N° de clase, encuestas anónimas, RLS)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/reglas.sql
      - name: anon y authenticated no leen credenciales
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          do $$ begin
            if has_table_privilege('anon', 'auth.users', 'select') or has_table_privilege('authenticated', 'auth.users', 'select')
              or has_table_privilege('anon', 'auth.tokens', 'select') or has_table_privilege('authenticated', 'auth.tokens', 'select')
            then raise exception 'auth.users / auth.tokens legibles por anon o authenticated'; end if;
          end $$;
          SQL

  imagen:
    name: Imagen Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t recoveryparts-app .
